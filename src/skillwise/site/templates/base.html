<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Skillwise{% endblock %}</title>
  <style>
    :root { --ink:#1a1a2e; --muted:#6b7280; --accent:#4f46e5; --bg:#fafaf9; --card:#ffffff; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin:0; background:var(--bg); color:var(--ink); }
    header { background:var(--ink); color:#fff; padding:14px 24px; display:flex; gap:24px; align-items:baseline; }
    header a { color:#fff; text-decoration:none; }
    header .brand { font-weight:700; font-size:18px; }
    header .nav a { color:#c7d2fe; margin-right:16px; font-size:14px; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background:var(--card); border:1px solid #e5e7eb; border-radius:10px; padding:16px 20px; margin-bottom:12px; }
    .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid; }
    .badge.pass { color:var(--ok); border-color:var(--ok); }
    .badge.warn { color:var(--warn); border-color:var(--warn); }
    .badge.fail { color:var(--bad); border-color:var(--bad); }
    .muted { color:var(--muted); font-size:13px; }
    input[type=text], input[type=file] { padding:8px 10px; border:1px solid #d1d5db; border-radius:8px; width:100%; }
    button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 18px; cursor:pointer; }
    pre { background:#f3f4f6; padding:12px; border-radius:8px; overflow-x:auto; font-size:13px; white-space:pre-wrap; }
    h1 { font-size:22px; } h2 { font-size:17px; }
    .caps span { margin-right:10px; font-size:13px; }
  </style>
</head>
<body>
<header>
  <span class="brand"><a href="/">Skillwise</a></span>
  <span class="nav"><a href="/">Catalog</a> <a href="/upload">Upload a skill</a></span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
